[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"
solc_version = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
allow_paths = ["../node_modules"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "poseidon-solidity/=../node_modules/poseidon-solidity/",
]
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 120
tab_width = 4
